<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товар 1 — Учебный интернет-магазин</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Скопируйте сюда вашу шапку <header class="site-header"> из index.html -->
  
  <main>
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <a class="breadcrumbs__link" href="catalog.html">Каталог</a>
      <span class="breadcrumbs__current">Товар 1</span>
    </nav>

    <section class="section product-details">
      <h1>Товар 1</h1>
      <div class="product-details__layout">
        <div class="product-details__info">
          <p class="product-card__price" style="font-size: 24px;">Цена: 1000 руб.</p>
          <p>Подробное описание учебного товара. Здесь размещается текст, который рассказывает о преимуществах данного продукта.</p>
          
          <!-- Обязательная таблица характеристик -->
          <table class="product-table">
            <caption>Характеристики товара</caption>
            <thead>
              <tr>
                <th>Параметр</th>
                <th>Значение</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Категория</td>
                <td>Учебный товар</td>
              </tr>
              <tr>
                <td>Наличие</td>
                <td>В наличии</td>
              </tr>
              <tr>
                <td>Вес</td>
                <td>1.5 кг</td>
              </tr>
            </tbody>
          </table>
          
          <a class="button button--primary" href="order.html">Оформить заказ</a>
        </div>
      </div>
    </section>
  </main>

  <!-- Скопируйте сюда ваш подвал <footer> из index.html -->
</body>
</html>
